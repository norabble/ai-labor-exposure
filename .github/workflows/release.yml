name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python via uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          uv sync
          npm install

      - name: Cache BLS zip downloads
        uses: actions/cache@v4
        id: bls-cache
        with:
          path: data/raw/bls
          key: bls-zips-${{ hashFiles('download_bls.js') }}

      - name: Download O*NET, Anthropic, and Eloundou source data
        run: uv run download_data.py

      - name: Download BLS data via Puppeteer
        if: steps.bls-cache.outputs.cache-hit != 'true'
        run: node download_bls.js

      # Deliberately outside the BLS zip cache gate: A-19 is a rolling monthly
      # table and must be re-fetched every run. Warns rather than fails if BLS
      # blocks the runner — seeds/cps_a19_panel.csv still carries real months.
      - name: Download CPS Table A-19 via Puppeteer
        run: node download_cps.js

      - name: Restore pre-computed classified tasks from seed
        run: |
          mkdir -p data/output
          cp seeds/classified_all_tasks.csv data/output/classified_all_tasks.csv

      - name: Run analysis pipeline
        run: uv run main.py 2>&1 | tee pipeline_run.txt

      - name: Package visualizations
        run: cd data/output && zip -r visualizations.zip visualizations/

      - name: Build release notes
        run: |
          cat > release_notes.md << 'EOF'
          ## AI Labor Market Exposure Analysis

          ### Output files

          | File | Description |
          |------|-------------|
          | `occupation_exposure_report.csv` | Per-occupation rebound-adjusted exposure scores (primary model output) |
          | `occupation_dynamic_model_report.csv` | Dynamic equilibrium model — signed net employment change per occupation |
          | `bls_trends.csv` | BLS employment/wage growth by occupation (2022–2025) |
          | `exposure_volume_by_occupation.csv` | Employment-weighted AI exposure by occupation |
          | `exposure_volume_by_group.csv` | Same, rolled up to SOC major group |
          | `employment_by_demand_type.csv` | Workers in each AI demand type bucket |
          | `cps_a19_panel.csv` | CPS Table A-19 employment by SOC major group and month |
          | `visualizations.zip` | All charts as a single download |

          Individual chart PNGs are also attached — see [CLAUDE.md](CLAUDE.md#outputs-reference) for descriptions.

          <details>
          <summary>Pipeline run log</summary>

          ```
          EOF
          cat pipeline_run.txt >> release_notes.md
          printf '```\n\n</details>\n' >> release_notes.md
          # strip leading whitespace added by the heredoc indentation
          sed -i 's/^          //' release_notes.md

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes-file release_notes.md \
            data/output/occupation_exposure_report.csv \
            data/output/occupation_dynamic_model_report.csv \
            data/output/bls_trends.csv \
            data/output/exposure_volume_by_occupation.csv \
            data/output/exposure_volume_by_group.csv \
            data/output/employment_by_demand_type.csv \
            data/output/cps_a19_panel.csv \
            data/output/visualizations.zip \
            data/output/visualizations/*.png

      # The release runs from a detached tag ref, and the two artifacts below
      # live only in git: docs/charts/images/ is what the docs render, and
      # seeds/cps_a19_panel.csv is the ONLY place CPS history exists, because
      # A-19 is a rolling table and data/ is gitignored. A run that fetches a
      # new month and then exits therefore loses it. Open a pull request against
      # main rather than pushing, so this works under branch protection and the
      # diff gets a look before it lands.
      - name: Open a pull request with refreshed charts and CPS panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          artifact_branch="release-artifacts/${TAG_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # data/ is gitignored, so the pipeline outputs survive the checkout.
          git fetch origin main
          git checkout -B "$artifact_branch" origin/main

          cp data/output/visualizations/*.png docs/charts/images/
          if [ -f data/output/cps_a19_panel.csv ]; then
            cp data/output/cps_a19_panel.csv seeds/cps_a19_panel.csv
          else
            echo "No CPS panel was produced this run; leaving the seed as is."
          fi

          if git diff --quiet -- docs/charts/images seeds/cps_a19_panel.csv; then
            echo "Charts and CPS panel are unchanged since main; nothing to open."
            exit 0
          fi

          git add docs/charts/images seeds/cps_a19_panel.csv
          git commit -m "Refresh charts and CPS panel from ${TAG_NAME}"
          git push --force-with-lease origin "$artifact_branch"

          cat > artifact_pr_body.md << EOF
          Generated by the release run for \`${TAG_NAME}\`.

          Contains the regenerated \`docs/charts/images/\` PNGs, and any CPS Table A-19
          months this run picked up. A-19 is a rolling page that carries only two
          months at a time, so \`seeds/cps_a19_panel.csv\` is the only record of those
          months — merging this is what preserves them.
          EOF

          gh pr create \
            --base main \
            --head "$artifact_branch" \
            --title "Refresh charts and CPS panel from ${TAG_NAME}" \
            --body-file artifact_pr_body.md \
            || echo "A pull request for $artifact_branch already exists; its branch has been updated."
