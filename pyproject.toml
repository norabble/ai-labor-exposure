[project]
name = "ai-exposure"
version = "0.1.0"
description = "Structural AI exposure scores for U.S. occupations, stratified by economic demand type"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Baker" }]
dependencies = [
    "beautifulsoup4>=4.14.3",
    "google-genai>=2.0.1",
    "html5lib>=1.1",
    "lxml>=6.1.1",
    "matplotlib>=3.10.8",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "pandas>=3.0.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
]

[project.urls]
Homepage = "https://github.com/norabble/ai-labor-exposure"
Issues = "https://github.com/norabble/ai-labor-exposure/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D100", # pydocstyle: every module needs a docstring (see CONTRIBUTING.md)
]
